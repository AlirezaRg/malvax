[project]
name = "malvax"
version = "0.1.0"
description = "Linux malware analysis and behavioral sandbox (defensive, laboratory use only)"
requires-python = ">=3.11"
dependencies = [
    "yara-python>=4.3",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27,<0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["malvax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end pipeline test (API, worker, database)",
    "sandbox: needs the Phase 4 analysis VM; skipped until it is connected",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
